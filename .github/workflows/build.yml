name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests en debug-APK bouwen
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: padelscore-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Elke push wordt een release; de app op het horloge kijkt naar de nieuwste.
      - name: Release maken
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk padelscore.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: v1.${{ github.run_number }}
          name: Winner Padel 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: padelscore.apk
          make_latest: true
